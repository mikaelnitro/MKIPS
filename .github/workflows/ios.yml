name: MK FLIP CI

# Compila e testa o MK FLIP num Mac na nuvem (grátis) e gera um .ipa sem
# assinatura para sideload no iPhone via Sideloadly/AltStore (Windows).
#
# Dispara em push/PR na branch principal e manualmente (workflow_dispatch).

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Compila e roda os testes XCTest no simulador de iPhone 16.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (Simulador)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto (.xcodeproj)
        run: xcodegen generate

      - name: Listar simuladores disponíveis
        run: xcrun simctl list devices available | grep -i iphone || true

      - name: Build + Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MKFlip.xcodeproj \
            -scheme MKFlip \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
          2>&1 | tee xcodebuild.log

      - name: ">>> RESUMO DE ERROS (visivel sem login) <<<"
        if: failure()
        run: |
          echo "## 🔴 Erros de compilação / teste" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Linhas de erro reais, caminho encurtado para legibilidade.
          grep -E "error:|fatal error:|Undefined symbol|cannot find|Command .* failed" xcodebuild.log \
            | sed 's#/Users/runner/[^ ]*/MKFlip/##g' \
            | sort -u | head -60 | tee -a "$GITHUB_STEP_SUMMARY" \
            | while IFS= read -r line; do
                short="${line:0:300}"
                echo "::error::${short}"
              done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Total de 'error:' = $(grep -c 'error:' xcodebuild.log || echo 0)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: |
            TestResults.xcresult
            xcodebuild.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2) Gera um .ipa SEM assinatura. O Sideloadly (Windows) reassina com o seu
  #    Apple ID grátis na hora de instalar no iPhone.
  # ---------------------------------------------------------------------------
  package-unsigned-ipa:
    name: Gerar .ipa (sem assinatura)
    runs-on: macos-15
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto (.xcodeproj)
        run: xcodegen generate

      - name: Build para dispositivo (sem assinar)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MKFlip.xcodeproj \
            -scheme MKFlip \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
          | tee build.log

      - name: Empacotar .ipa
        run: |
          APP_DIR="build/Build/Products/Release-iphoneos"
          if [ ! -d "$APP_DIR/MKFlip.app" ]; then
            echo "::error::MKFlip.app não encontrado — o build falhou."
            exit 1
          fi
          cd "$APP_DIR"
          mkdir -p Payload
          cp -R MKFlip.app Payload/
          zip -qr MKFlip-unsigned.ipa Payload
          echo "IPA gerado: $(ls -lh MKFlip-unsigned.ipa)"

      - name: Publicar o .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MKFlip-unsigned-ipa
          path: build/Build/Products/Release-iphoneos/MKFlip-unsigned.ipa
          if-no-files-found: error
