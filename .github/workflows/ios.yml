name: MK FLIP CI

# Compila e testa o MK FLIP num Mac na nuvem (grátis) e gera um .ipa sem
# assinatura para sideload no iPhone via Sideloadly/AltStore (Windows).

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Compila e roda os testes XCTest num simulador de iPhone disponível.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (Simulador)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar o Xcode mais novo
        run: |
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$LATEST" ] && LATEST=/Applications/Xcode.app
          echo "Usando: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          echo "--- Runtimes de simulador ---"
          xcrun simctl list runtimes

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto (.xcodeproj)
        run: xcodegen generate

      - name: Escolher um simulador de iPhone
        id: sim
        run: |
          set -e
          # Garante que exista um runtime de iOS (baixa se faltar).
          if ! xcrun simctl list runtimes | grep -qi "iOS"; then
            echo "Nenhum runtime iOS — baixando plataforma..."
            xcodebuild -downloadPlatform iOS
          fi
          # Pega o UDID do primeiro iPhone disponível.
          UDID=$(xcrun simctl list devices available \
                 | grep -i "iPhone" \
                 | grep -oiE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
                 | head -1 || true)
          # Se não houver nenhum, cria um a partir do runtime/devicetype mais novos.
          if [ -z "$UDID" ]; then
            RT=$(xcrun simctl list runtimes | grep -oiE 'com.apple.CoreSimulator.SimRuntime.iOS[^ ]*' | tail -1)
            DT=$(xcrun simctl list devicetypes | grep -oiE 'com.apple.CoreSimulator.SimDeviceType.iPhone[^ )]*' | tail -1)
            echo "Criando simulador: $DT / $RT"
            UDID=$(xcrun simctl create "ci-iphone" "$DT" "$RT")
          fi
          echo "Simulador escolhido: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build + Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MKFlip.xcodeproj \
            -scheme MKFlip \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
          2>&1 | tee xcodebuild.log

      - name: ">>> RESUMO DE ERROS (visivel sem login) <<<"
        if: failure()
        run: |
          echo "## 🔴 Erros de compilação / teste" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f xcodebuild.log ]; then
            grep -E "error:|fatal error:|Undefined symbol|cannot find|Command .* failed" xcodebuild.log \
              | sed 's#/Users/runner/[^ ]*/MKFlip/##g' \
              | sort -u | head -60 | tee -a "$GITHUB_STEP_SUMMARY" \
              | while IFS= read -r line; do
                  short="${line:0:300}"
                  echo "::error::${short}"
                done
            echo "Total de 'error:' = $(grep -c 'error:' xcodebuild.log || echo 0)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(xcodebuild.log não gerado — falha antes do build)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: |
            TestResults.xcresult
            xcodebuild.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2) Gera um .ipa SEM assinatura (Sideloadly reassina no Windows).
  # ---------------------------------------------------------------------------
  package-unsigned-ipa:
    name: Gerar .ipa (sem assinatura)
    runs-on: macos-15
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar o Xcode mais novo
        run: |
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -z "$LATEST" ] && LATEST=/Applications/Xcode.app
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto (.xcodeproj)
        run: xcodegen generate

      - name: Build para dispositivo (sem assinar)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MKFlip.xcodeproj \
            -scheme MKFlip \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
          2>&1 | tee build.log

      - name: Empacotar .ipa
        run: |
          APP_DIR="build/Build/Products/Release-iphoneos"
          if [ ! -d "$APP_DIR/MKFlip.app" ]; then
            echo "::error::MKFlip.app não encontrado — o build falhou."
            exit 1
          fi
          cd "$APP_DIR"
          mkdir -p Payload
          cp -R MKFlip.app Payload/
          zip -qr MKFlip-unsigned.ipa Payload
          echo "IPA gerado: $(ls -lh MKFlip-unsigned.ipa)"

      - name: Publicar o .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MKFlip-unsigned-ipa
          path: build/Build/Products/Release-iphoneos/MKFlip-unsigned.ipa
          if-no-files-found: error
